# Application Configuration
spring.application.name=usdt-mall-backend
server.port=8080

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/usdt_mall?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Blossom2$

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Logging Configuration
logging.file.path=/data/usdt-mall-backend-log
logging.file.name=usdt-mall.log
logging.level.root=info
logging.level.com.usdt.mall.dao=debug
logging.level.org.springframework.web=DEBUG
logging.level.com.usdt.mall.controller=DEBUG

# ID Generator Configuration
id.worker-id=1
id.data-center-id=1

# JWT Configuration
jwt-secret=usdt-mall-secret-key-2024-secure-token-for-authentication
jwt.expiration=604800000

# MinIO Configuration
minio.url=http://127.0.0.1:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucket=usdt-mall

# File Upload Configuration
file.max-size=524288000
file.allowed-types=jpg,jpeg,png,gif,pdf,doc,docx,txt,xlsx,xls,zip,rar,apk,ipa
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=5000MB

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
